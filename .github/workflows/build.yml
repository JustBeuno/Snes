name: Build cores

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK at $NDK"
          cd libretro/jni
          "$NDK/ndk-build" -j"$(nproc)" APP_ABI="arm64-v8a armeabi-v7a" APP_PLATFORM=android-21

      - name: Name the cores
        run: |
          mkdir -p out
          # Official Snes9x file name, so RetroArch uses its existing Snes9x
          # core info (without it RetroArch won't offer the core for .sfc
          # files). Installing this replaces "Snes9x - Current".
          cp libretro/libs/arm64-v8a/libretro.so   out/snes9x_libretro_android.so
          cp libretro/libs/arm64-v8a/libretro.so   out/snes9x_archipelago_libretro_android.so
          cp libretro/libs/armeabi-v7a/libretro.so out/snes9x_archipelago_32bit_libretro_android.so
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  n3ds:
    runs-on: ubuntu-latest
    env:
      # The same image RetroArch's own 3DS CI uses (older devkitARM that
      # produces working .3dsx files for RetroArch).
      IMAGE: reallibretroretroarch/libretro-build-devkitpro:latest
      # Pinned RetroArch snapshot: current Snes9x needs helpers newer than 1.22.2.
      RA_COMMIT: 8e4598b6e6c15eb0654eff2c5c3549ad48f81e83
    steps:
      - uses: actions/checkout@v4

      - name: Build the core and RetroArch 3DS
        shell: bash
        run: |
          docker run --rm --user root -v "$PWD":/w -w /w -e RA_COMMIT "$IMAGE" bash -c '
            set -o pipefail
            make -C libretro platform=ctr -j"$(nproc)" 2>&1 | tee core-build.log || exit 1
            git init -q ra && git -C ra fetch -q --depth 1 https://github.com/libretro/RetroArch.git "$RA_COMMIT" && git -C ra checkout -q FETCH_HEAD
            cp libretro/snes9x_libretro_ctr.a ra/libretro_ctr.a
            cd ra
            make -f Makefile.ctr LIBRETRO=snes9x BUILD_CIA=0 USE_CTRULIB_2=1 -j"$(nproc)" 2>&1 | tee ../retroarch-build.log || exit 1
            mkdir -p ../out && cp retroarch_3ds.3dsx ../out/snes9x_libretro.3dsx
            make -f Makefile.ctr LIBRETRO=snes9x BUILD_CIA=1 USE_CTRULIB_2=1 retroarch_3ds.cia > ../cia-build.log 2>&1 && cp retroarch_3ds.cia ../out/snes9x_libretro.cia || echo "CIA build skipped"
            chmod -R a+rwX /w
          '
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: 3ds
          path: out/*

      - name: Save build logs to the ci-logs branch on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/logs
          cp *.log /tmp/logs/ 2>/dev/null || true
          for f in /tmp/logs/*.log; do grep -nE "error|Error|undefined reference|multiple definition|relSrc|invalid" "$f" | head -200 > "$f.errors" || true; tail -150 "$f" > "$f.tail"; done
          cd /tmp/logs && git init -q && git config user.name CI && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "3DS build logs for run ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs

  release:
    needs: [android, n3ds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SMZ3 Archipelago core (build ${GITHUB_RUN_NUMBER})" \
            --notes "Android: download snes9x_libretro_android.so on your phone, then in RetroArch: Main Menu > Load Core > Install or Restore a Core (replaces Snes9x, keeps working for every SNES game). Force-stop RetroArch afterwards.

          3DS (Homebrew Launcher RetroArch): copy snes9x_libretro.3dsx to sd:/retroarch/cores/ replacing the existing file. 3DS (CIA RetroArch): install snes9x_libretro.cia with FBI.

          Don't update Snes9x with RetroArch's Core Downloader or it will put the stock core back." \
            --latest
