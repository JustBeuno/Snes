name: Build Android core

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK at $NDK"
          cd libretro/jni
          "$NDK/ndk-build" -j"$(nproc)" APP_ABI="arm64-v8a armeabi-v7a" APP_PLATFORM=android-21

      - name: Name the cores
        run: |
          mkdir -p out
          cp libretro/libs/arm64-v8a/libretro.so   out/snes9x_archipelago_libretro_android.so
          cp libretro/libs/armeabi-v7a/libretro.so out/snes9x_archipelago_32bit_libretro_android.so
          # Same core under the official Snes9x file name, so RetroArch uses its
          # existing Snes9x core info (without it RetroArch won't offer the core
          # for .sfc files). Installing this replaces "Snes9x - Current".
          cp libretro/libs/arm64-v8a/libretro.so   out/snes9x_libretro_android.so
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: snes9x-archipelago-android
          path: out/*.so

      - name: Publish as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.so \
            --title "SMZ3 Archipelago core (build ${GITHUB_RUN_NUMBER})" \
            --notes "Recommended: download snes9x_libretro_android.so on your phone, then in RetroArch: Main Menu > Load Core > Install or Restore a Core. It replaces the Snes9x (Current) core, keeps working for every SNES game, and adds Archipelago for SMZ3. Force-stop RetroArch afterwards. (Don't run the Core Updater on Snes9x or it will put the stock core back.) The snes9x_archipelago files are the same core under its own name." \
            --latest
